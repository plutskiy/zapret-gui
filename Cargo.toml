[package]
name = "zapret_gui"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.9.4"
aes-gcm = "0.11.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
eframe = "0.37.0"
egui = "0.37.0"
hkdf = "0.13.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
webpki-roots = "1.0.12"

[target."cfg(windows)".dependencies]
libloading = "0.9.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"
