[package]
name = "zapret_gui"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.9.4"
aes-gcm = "0.11.1"
ctr = "0.10.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
eframe = "0.37.0"
egui = "0.37.0"
egui_extras = { version = "0.37.0", default-features = false, features = ["svg"] }
hkdf = "0.13.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
futures-util = { version = "0.3.31", features = ["sink"] }
getrandom = "0.3.4"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.28.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
webpki-roots = "1.0.12"

[target."cfg(windows)".dependencies]
image = { version = "0.25.10", default-features = false, features = ["ico", "png"] }
libloading = "0.9.1"
tray-icon = "0.26.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"
